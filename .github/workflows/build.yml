name: Build Docker Image
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [ "light", "full" ]
    # amd64 は ubuntu-24.04、arm64 は ubuntu-24.04-arm のネイティブ runner で並列にビルドし、manifest をまとめる
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      # 手動実行はビルドの確認だけにし、push は v* タグのときだけ
      push: ${{ startsWith(github.ref, 'refs/tags/v') }}
      target: ${{ matrix.target }}
      platforms: linux/amd64,linux/arm64
      job-name-prefix: ${{ matrix.target }}
      cache: true
      cache-mode: max
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: |
        latest=false
      meta-tags: |
        type=semver,pattern={{version}},suffix=-${{ matrix.target }}
        type=raw,value=latest,suffix=-${{ matrix.target }}
        type=semver,pattern={{version}},enable=${{ matrix.target == 'light' }}
        type=raw,value=latest,enable=${{ matrix.target == 'light' }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
